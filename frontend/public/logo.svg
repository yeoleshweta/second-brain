<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A0F12"/>
      <stop offset="0.62" stop-color="#0B0B10"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g filter="url(#glow)" fill="none" stroke="#FF4545" stroke-linejoin="round" font-family="Cinzel, Georgia, serif" font-weight="700" text-anchor="middle">
    <text x="256" y="210" font-size="78" stroke-width="4" letter-spacing="10">THE</text>
    <text x="256" y="340" font-size="132" stroke-width="5" letter-spacing="2">VOID</text>
  </g>
</svg>
