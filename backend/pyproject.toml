[project]
name = "second-brain-backend"
version = "0.1.0"
description = "Multi-agent personal AI backend"
requires-python = ">=3.11"
dependencies = [
    # LLM + agent framework
    "openai>=1.50.0",
    "langgraph>=0.2.50",
    "langchain-openai>=0.2.0",

    # MCP — standard tool integration
    "mcp>=1.0.0",

    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",

    # Knowledge agent
    "feedparser>=6.0.0",
    "arxiv>=2.1.0",

    # Calendar agent — Google
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",

    # Finance agent — Plaid
    "plaid-python>=27.0.0",

    # Health agent — file watching for Apple Health exports
    "watchdog>=5.0.0",

    # Storage
    "sqlmodel>=0.0.22",
    "alembic>=1.13.0",

    # Config + utilities
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "apscheduler>=3.10.0",
    "cryptography>=43.0.0",
    "pillow>=11.0.0",  # for receipt image handling
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipython>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
